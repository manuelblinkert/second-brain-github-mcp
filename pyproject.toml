[project]
name = "second-brain-github-mcp"
version = "0.1.0"
description = "Authenticated remote MCP server that lets Claude read/write one GitHub-backed second-brain vault, for a single user or a team with per-member GitHub attribution."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.27,<2",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
